<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <!-- viewport-fit=cover : indispensable pour que env(safe-area-inset-*) fonctionne
       sur iPhone à encoche / Dynamic Island. Le zoom reste autorisé : le bloquer
       est un manquement d'accessibilité (WCAG 1.4.4). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS (minified) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <style>
    /* touch-action ciblé sur les éléments interactifs : supprime le délai de
       300 ms au tap sans empêcher le pincement pour zoomer sur la page. */
    button,
    a,
    [role="button"],
    input[type="checkbox"],
    input[type="radio"],
    select {
      touch-action: manipulation;
    }

    html,
    body {
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
    }

    /* 16px minimum : en dessous, iOS Safari zoome automatiquement à la prise
       de focus et l'utilisateur se retrouve avec une page décadrée. */
    input,
    textarea,
    select {
      font-size: 16px !important;
    }
  </style>

  <title>Map Action</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
