name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Obligatoire : src/config/api_url_base.js refuse de se charger sans
          # elle, pour qu'aucun deploiement ne vise la production par accident.
          # A renseigner dans Settings > Secrets and variables > Actions.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Optionnel : active seulement le fond de carte satellite. Sans lui,
          # la carte fonctionne avec les tuiles OpenStreetMap ouvertes.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # GitHub Pages sert depuis https://<org>.github.io/<depot>/ : sans
          # ce prefixe, la page demande ses assets a la racine du domaine et
          # recoit des 404. Un deploiement auto-heberge a la racine d'un
          # domaine n'a pas besoin de renseigner cette variable.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: false
